name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    env:
      # Pinned deliberately. Floating to whatever PSGallery serves that morning
      # means a new analyzer release can turn main red with nothing in the diff
      # to explain it. Bumping is a one-line edit here and the cache key follows
      # it automatically, so the upgrade arrives as a reviewable commit.
      PSSA_VERSION: '1.25.0'
    # The module is saved under RUNNER_TEMP, not the workspace: anything under
    # the checkout would be walked by `Invoke-ScriptAnalyzer -Path . -Recurse`
    # below, which would then analyse the analyser's own hundreds of .ps1/.psd1
    # files. RUNNER_TEMP is also account-name independent, unlike the
    # CurrentUser module path, so the cache key stays stable.
    # $env:RUNNER_TEMP in the scripts, ${{ runner.temp }} only in `with:` - the
    # runner context is NOT available in jobs.<id>.env and would expand to "".
    steps:
      - uses: actions/checkout@v4

      - name: Restore PSScriptAnalyzer from cache
        id: pssa-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\pssa
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}

      - name: Install PSScriptAnalyzer
        if: steps.pssa-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          # Windows PowerShell 5.1 still negotiates TLS 1.0/1.1 by default,
          # while PSGallery has required 1.2 for years. The mismatch surfaces as
          # an opaque "Unable to connect to the remote server" - which is how a
          # build with a clean diff went red on 2026-08-06.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # A typo in the pin is not a network problem. Catch it before the
          # retry loop, or three attempts burn 15s of backoff and the failure
          # message then blames PSGallery for a one-character mistake.
          $parsed = $null
          if (-not [version]::TryParse($env:PSSA_VERSION, [ref]$parsed)) {
            Write-Host "PSSA_VERSION is '$env:PSSA_VERSION', which is not a version number." -ForegroundColor Red
            Write-Host "Fix the pin in .github/workflows/lint.yml. This is not a network failure." -ForegroundColor Red
            exit 1
          }

          $dir = Join-Path $env:RUNNER_TEMP "pssa"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # Save-Module, not Install-Module: it drops the module at a path we
          # choose, which is what makes the cache key independent of the runner
          # account name.
          $ok   = $false
          $last = $null
          foreach ($attempt in 1..3) {
            try {
              if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
                Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction Stop | Out-Null
              }
              Set-PSRepository PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
              Save-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION `
                          -Repository PSGallery -Path $dir -Force -ErrorAction Stop
              $ok = $true
              Write-Host "PSScriptAnalyzer $env:PSSA_VERSION downloaded (attempt $attempt)" -ForegroundColor Green
              break
            } catch {
              $last = $_
              Write-Host "attempt $attempt/3 failed: $($_.Exception.Message)" -ForegroundColor Yellow
              # FullyQualifiedErrorId, never the message text: error messages are
              # localised (this was written against a runner whose PowerShell
              # answers in Russian) and matching English words there silently
              # takes the wrong branch.
              if ($_.FullyQualifiedErrorId -like 'NoMatchFoundForCriteria*') {
                Write-Host "  the gallery answered - it has no such version; not retrying" -ForegroundColor DarkGray
                break
              }
              if ($attempt -lt 3) {
                $wait = 5 * $attempt
                Write-Host "  retrying in $wait s..." -ForegroundColor DarkGray
                Start-Sleep -Seconds $wait
              }
            }
          }

          if (-not $ok) {
            Write-Host ""
            Write-Host "Could not download PSScriptAnalyzer $env:PSSA_VERSION from PSGallery." -ForegroundColor Red
            Write-Host "Last error: $($last.Exception.Message)" -ForegroundColor Red
            Write-Host ""
            if ($last.FullyQualifiedErrorId -like 'NoMatchFoundForCriteria*') {
              Write-Host "PSGallery answered but has no version $env:PSSA_VERSION of PSScriptAnalyzer." -ForegroundColor Yellow
              Write-Host "That is a wrong pin, not an outage. Fix PSSA_VERSION in" -ForegroundColor Yellow
              Write-Host ".github/workflows/lint.yml; re-running the job will not help." -ForegroundColor Yellow
            } else {
              Write-Host "This step is the only one in the whole workflow that reaches the network." -ForegroundColor Yellow
              Write-Host "A failure here is almost always PSGallery or the runner's connectivity," -ForegroundColor Yellow
              Write-Host "NOT the code in this pull request - nothing in the diff can cause it." -ForegroundColor Yellow
              Write-Host "Check https://status.powershellgallery.com and re-run the job before" -ForegroundColor Yellow
              Write-Host "looking for anything in the changes." -ForegroundColor Yellow
            }
            exit 1
          }
          exit 0

      - name: Analyze
        shell: powershell
        run: |
          $mod = Join-Path $env:RUNNER_TEMP "pssa\PSScriptAnalyzer\$env:PSSA_VERSION\PSScriptAnalyzer.psd1"
          if (-not (Test-Path $mod)) {
            Write-Host "PSScriptAnalyzer $env:PSSA_VERSION is not at $mod." -ForegroundColor Red
            Write-Host "The cache restored something unexpected - re-run with the cache cleared." -ForegroundColor Red
            exit 1
          }
          Import-Module $mod -Force
          Write-Host "Using PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"

          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($r) {
            $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Host "PSScriptAnalyzer: $($r.Count) findings" -ForegroundColor Red
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean" -ForegroundColor Green
          exit 0

  shell:
    name: Shell installer
    # ubuntu, not windows: this is the only job that runs orchestra.sh on the
    # platform it is actually FOR. Developed on Git Bash it may look fine and
    # still trip over a BSD/GNU difference or a CRLF checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --shell=sh dist/orchestra.sh dist/banner.sh
          echo "shellcheck: clean"

      - name: Line endings must be LF
        run: |
          bad=0
          for f in dist/orchestra.sh dist/banner.sh; do
            # -P with an explicit \r, not $'\r': the shell-quoted form has a
            # habit of reaching grep as an empty pattern, which matches every
            # line and turns this check into a guaranteed pass or fail.
            if LC_ALL=C grep -qP '\r' "$f"; then echo "CRLF in $f"; bad=1; fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "both scripts are LF"

      - name: banner.sh must stay a library
        run: |
          # Sourcing it has to be silent and side-effect free: orchestra.sh
          # sources it before it has decided what the run is even about.
          before=$(set -o; env | sort)
          out=$(. ./dist/banner.sh 2>&1)
          . ./dist/banner.sh
          after=$(set -o; env | sort)
          if [ -n "$out" ]; then echo "sourcing printed: $out"; exit 1; fi
          if [ "$before" != "$after" ]; then echo "sourcing changed shell state"; exit 1; fi
          echo "sourcing is silent and inert"

      - name: Banner must not exceed 78 columns
        run: |
          . ./dist/banner.sh
          orchestra_show_banner "$(cat VERSION)" "https://github.com/example/design-orchestra" > /tmp/banner.txt
          w=$(awk '{ if (length($0) > m) m = length($0) } END { print m }' /tmp/banner.txt)
          h=$(wc -l < /tmp/banner.txt)
          echo "width $w, height $h"
          [ "$w" -le 78 ] || { echo "banner is $w columns wide"; exit 1; }
          [ "$h" -le 12 ] || { echo "banner is $h lines tall"; exit 1; }
          # Strict ASCII: PowerShell 5.1 mangles anything else, and the two
          # installers must print the same bytes.
          if LC_ALL=C grep -qP '[^\x20-\x7e]' /tmp/banner.txt; then
            echo "non-ASCII in the banner"; exit 1
          fi
          echo "78-column and ASCII limits hold"

      - name: Install smoke test on an empty folder
        run: |
          set -eu
          orch="$GITHUB_WORKSPACE/dist/orchestra.sh"
          export DESIGN_ORCHESTRA_HOME="$RUNNER_TEMP/seed"
          export DESIGN_ORCHESTRA_REPO="https://github.com/example/design-orchestra"
          proj="$RUNNER_TEMP/proj"; mkdir -p "$proj"; cd "$proj"

          # Same intent as the PowerShell smoke test: assert the exit code of
          # every branch, so one that falls off the end cannot pass silently.
          run() {
            label=$1; expected=$2; shift 2
            set +e; sh "$orch" "$@" > /tmp/out.txt 2>&1; code=$?; set -e
            if [ "$code" -ne "$expected" ]; then
              echo "  $label -> $code, expected $expected"; sed 's/^/    | /' /tmp/out.txt; exit 1
            fi
            echo "  $label -> $code (ok)"
          }

          run "install"   0
          for f in .claude/agents/builder.md .claude/skills/start/SKILL.md \
                   .claude/skills/feature/SKILL.md .claude/skills/concept/SKILL.md \
                   .claude/skills/foundation/SKILL.md .claude/skills/log/SKILL.md \
                   AGENTS.md brain/rules/ux-patterns.md specs/_template.md \
                   .orchestra-version .orchestra-manifest.txt; do
            [ -e "$f" ] || { echo "not deployed: $f"; exit 1; }
          done
          src=$(find "$GITHUB_WORKSPACE/dist/payload/.claude/skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
          dst=$(find .claude/skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          [ "$src" -eq "$dst" ] || { echo "deployed $dst skills, distribution has $src"; exit 1; }
          echo "  skills deployed -> $dst (ok)"

          run "--update"   0 --update
          run "re-run"     0
          run "--status"   0 --status
          run "--promote"  0 --promote
          run "--no-banner" 0 --no-banner
          run "--help"     0 --help
          # --share must refuse rather than approximate: its anonymisation
          # cannot be reproduced with POSIX tools, and a second, weaker privacy
          # floor would be worse than not having the feature here.
          run "--share refuses"  2 --share
          run "unknown option"   2 --updat

          cd "$GITHUB_WORKSPACE"
          run "guard: refuses inside the repo" 1

          echo "All exit codes are explicit and correct"

      - name: A manifest written on Windows must not orphan everything
        run: |
          set -eu
          orch="$GITHUB_WORKSPACE/dist/orchestra.sh"
          export DESIGN_ORCHESTRA_HOME="$RUNNER_TEMP/seed2"
          proj="$RUNNER_TEMP/proj2"; mkdir -p "$proj"; cd "$proj"
          sh "$orch" --no-banner > /dev/null
          # Exactly what init-orchestra.ps1 writes: backslash separators.
          sed 's|/|\\|g' .orchestra-manifest.txt > m.txt && mv m.txt .orchestra-manifest.txt
          sh "$orch" --update > /dev/null
          n=$(find .claude -name '*.bak' | wc -l)
          [ "$n" -eq 0 ] || { echo "$n files were wrongly treated as orphans"; exit 1; }
          echo "cross-platform manifest handled (0 false orphans)"

  encoding:
    name: Encoding and structure
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .ps1/.psd1 must be UTF-8 with BOM
        shell: powershell
        run: |
          $bad = @()
          foreach ($f in (Get-ChildItem -Recurse -Include *.ps1,*.psd1)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              $bad += $f.FullName
            }
          }
          if ($bad) {
            Write-Host "Missing BOM (keeps encoding stable across editors):" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All scripts are UTF-8 with BOM" -ForegroundColor Green
          exit 0

      - name: VERSION matches CHANGELOG
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $head = (Get-Content CHANGELOG.md | Where-Object { $_ -match '^##\s' } | Select-Object -First 1)
          if ($head -notmatch [regex]::Escape($v)) {
            Write-Host "VERSION = $v but the first CHANGELOG entry is: $head" -ForegroundColor Red
            exit 1
          }
          Write-Host "VERSION $v matches CHANGELOG" -ForegroundColor Green
          exit 0

      - name: Install smoke test on an empty folder
        shell: powershell
        run: |
          $proj = Join-Path $env:RUNNER_TEMP "proj"
          New-Item -ItemType Directory -Force $proj | Out-Null
          Push-Location $proj
          $script = "$env:GITHUB_WORKSPACE\dist\init-orchestra.ps1"

          # Every branch must end in an explicit `exit`. Without one,
          # $LASTEXITCODE keeps whatever it held before the call - $null in a
          # fresh process, or a stale code from an earlier command. This helper
          # poisons the variable first, so a missing exit shows up as <unset>
          # instead of silently inheriting a passing 0.
          # Splat a HASHTABLE, never an array: array splatting silently fails to
          # bind switch parameters (-Update arrives as a dropped positional arg,
          # with no error), so every case would quietly test the default branch.
          function Invoke-Orchestra {
            param([string]$Label, [int]$Expected, [hashtable]$ScriptArgs = @{})
            $global:LASTEXITCODE = 99
            & $script @ScriptArgs | Out-Null
            $code = $LASTEXITCODE
            if ($code -eq 99) { throw "$Label left no exit code (branch falls off the end of the script)" }
            if ($code -ne $Expected) { throw "$Label returned $code, expected $Expected" }
            Write-Host "  $Label -> $code (ok)"
          }

          Invoke-Orchestra "install" 0
          $need = @(
            ".claude\agents\builder.md",
            ".claude\skills\start\SKILL.md",
            ".claude\skills\feature\SKILL.md",
            ".claude\skills\concept\SKILL.md",
            ".claude\skills\foundation\SKILL.md",
            ".claude\skills\log\SKILL.md",
            "AGENTS.md",
            "brain\rules\ux-patterns.md",
            "specs\_template.md",
            ".orchestra-version",
            ".orchestra-manifest.txt"
          )
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $proj $_)) }
          if ($missing) {
            Write-Host "Not deployed:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          # Count as well as name the skills: the payload is enumerated
          # dynamically, so a skill added to dist/ but not to $need above would
          # otherwise ship untested.
          $srcSkills = @(Get-ChildItem "$env:GITHUB_WORKSPACE\dist\payload\.claude\skills" -Directory).Count
          $dstSkills = @(Get-ChildItem (Join-Path $proj ".claude\skills") -Directory).Count
          if ($dstSkills -ne $srcSkills) {
            Write-Host "Deployed $dstSkills skill(s), distribution has $srcSkills" -ForegroundColor Red
            exit 1
          }
          Write-Host "  skills deployed -> $dstSkills (ok)"
          # The same class of bug applies to every branch, so check them all.
          # Expectations must not depend on $DefaultRepoUrl, which a fork edits:
          # the repo URL is pinned per case through the environment variable.
          $env:DESIGN_ORCHESTRA_HOME = Join-Path $env:RUNNER_TEMP "seed"
          $env:DESIGN_ORCHESTRA_REPO = "https://github.com/example/design-orchestra"

          Invoke-Orchestra "-Update"  0 @{ Update  = $true }
          Invoke-Orchestra "re-run"   0
          Invoke-Orchestra "-Status"  0 @{ Status  = $true }
          Invoke-Orchestra "-Promote" 0 @{ Promote = $true }
          # No rules are marked in the seed, so -Share must bow out cleanly.
          Invoke-Orchestra "-Share (no candidates)" 0 @{ Share = $true }

          $env:DESIGN_ORCHESTRA_REPO = "http://not-https.example/x"
          Invoke-Orchestra "-Share (non-https repo rejected)" 1 @{ Share = $true }
          Remove-Item Env:\DESIGN_ORCHESTRA_REPO

          Pop-Location
          Push-Location $env:GITHUB_WORKSPACE
          Invoke-Orchestra "guard: refuses to run inside the repo" 1
          Pop-Location

          Write-Host "All exit codes are explicit and correct" -ForegroundColor Green

          # GitHub appends `if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }`
          # to every `shell: powershell` block. The guard case above deliberately
          # returns 1, so without this line the step inherits that 1 and fails even
          # though every assertion passed. Same bug this release fixes in the
          # installer - it just moved up one layer.
          exit 0
